services:
  arr-mgmt:
    image: ghcr.io/gitsumhubs/arr-mgmt:latest
    container_name: arr-mgmt
    restart: unless-stopped
    pull_policy: always
    ports:
      - "7664:7664"
    volumes:
      - /docker/arr-mgmt:/data
      # Needed for container restart and log viewer features.
      # SECURITY: this grants root-equivalent access to the Docker host.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ARR_MGMT_DATA_DIR: /data
      TZ: Etc/UTC
